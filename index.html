<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>31 Years of Awesome</title>
    
    <link rel="icon" href="favicon.png" type="image/png">
    <link href="https://fonts.googleapis.com/css2?family=Indie+Flower&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    
    <style>
        :root {
            /* --- DESKTOP VARIABLES --- */
            --book-width: 70vw; 
            --book-height: 39.375vw; /* 16:9 Ratio */
            --page-bg: #fdfbf7;
        }

        body {
            background-color: #ffffff;
            background-image: 
                linear-gradient(#a3c2e0 1px, transparent 1px),
                linear-gradient(90deg, #a3c2e0 1px, transparent 1px);
            background-size: 30px 30px;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: 'Indie Flower', cursive;
            overflow: hidden;
            position: relative;
        }

        /* --- STYLES --- */
        .sticker {
            position: absolute;
            opacity: 0.8;
            pointer-events: none;
            z-index: -1; 
            filter: contrast(110%);
        }

        .paper-ball {
            position: absolute;
            pointer-events: none;
            z-index: 0; 
            filter: drop-shadow(10px 15px 20px rgba(0,0,0,0.5)); 
            opacity: 0.9;
        }

        .scene {
            width: var(--book-width);
            height: var(--book-height);
            perspective: 2000px;
            z-index: 10; 
            transition: all 0.5s ease;
        }

        .book {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            box-shadow: 0 20px 50px rgba(0,0,0,0.4); 
        }

        /* --- INTELLIGENT BACK COVER SYSTEM (The Fix) --- */
        .book-base {
            position: absolute;
            top: 0;
            height: 100%;
            background: #e3d0b9; 
            z-index: 0; 
            box-shadow: inset 0 0 20px rgba(0,0,0,0.1);
            border-radius: 2px;
        }
        
        /* Desktop: Standard Split */
        .book-base.left { left: 0; width: 50%; border-right: 1px solid rgba(0,0,0,0.1); }
        .book-base.right { right: 0; width: 50%; }

        /* --- PAGES --- */
        .page {
            width: 50%;
            height: 100%;
            position: absolute;
            right: 0;
            top: 0;
            transform-origin: left center;
            transform-style: preserve-3d;
            transition: transform 1.2s cubic-bezier(0.645, 0.045, 0.355, 1);
            cursor: pointer;
        }

        .face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.1);
            padding: 20px;
            box-sizing: border-box;
            background-color: var(--page-bg);
        }

        .face::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-image: linear-gradient(to bottom right, rgba(0,0,0,0.05), transparent);
            opacity: 0.5;
            pointer-events: none;
        }

        .front { transform: rotateY(0deg); z-index: 2; border-left: 1px solid #ddd; }
        .back { transform: rotateY(180deg); background-color: #f8f5f0; z-index: 1; border-right: 1px solid #ccc; }
        .flipped { transform: rotateY(-180deg); }

        h1 { margin: 0; font-size: 3vw; color: #444; text-align: center; }
        p.caption { font-size: 1.2vw; color: #666; text-align: center; margin-top: 10px; max-width: 80%; }
        
        .letter-content {
            width: 85%;
            height: 85%;
            display: flex;
            flex-direction: column;
            justify-content: flex-start; 
            align-items: flex-start;
            overflow: hidden; 
        }

        .letter-content h2 {
            font-size: 1.8vw;
            color: #333;
            margin: 0 0 1vw 0;
            width: 100%;
            text-align: left;
            border-bottom: 2px solid #e0e0e0;
            padding-bottom: 5px;
        }

        .letter-content p {
            font-size: 1vw; 
            color: #444;
            text-align: left; 
            line-height: 1.5;
            margin: 0;
            white-space: pre-wrap; 
        }

        .photo-frame {
            background: white;
            padding: 1vw 1vw 3vw 1vw;
            box-shadow: 2px 2px 10px rgba(0,0,0,0.2);
            width: 65%;
            position: relative;
            transition: transform 0.3s ease;
        }
        .photo-frame img { width: 100%; display: block; pointer-events: none; }

        .tape {
            position: absolute;
            top: -1.5vw;
            left: 50%;
            transform: translateX(-50%);
            width: 25%;
            height: 3vw;
            background-color: rgba(255, 255, 255, 0.6);
            border-left: 2px dotted rgba(0,0,0,0.1);
            border-right: 2px dotted rgba(0,0,0,0.1);
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        
        .page-num {
            position: absolute;
            bottom: 15px;
            right: 20px;
            font-size: 1vw;
            color: #ccc;
        }

        /* --- MOBILE OVERRIDES --- */
        @media (max-width: 768px) {
            :root {
                --book-width: 90vw;
                --book-height: 45vh; 
            }
            .scene { margin-top: 40vh; }

            /* --- FIXED BACK COVER FOR MOBILE --- */
            .book-base.left {
                /* OVERSIZED to create a border effect */
                width: 106%; 
                left: -3%; /* Center the extra width */
                height: 105%; /* Stick out bottom */
                top: -1%; /* Stick out top slightly */
                
                border-radius: 6px;
                /* Thick 3D Lip at bottom */
                border-bottom: 10px solid #c2b099; 
                box-shadow: 0 10px 20px rgba(0,0,0,0.3);
            }
            .book-base.right { display: none; } /* Hide right half */

            .page {
                width: 100%;
                height: 100%;
                right: auto;
                top: 0;
                transform-origin: top center; 
            }

            .front { border-left: none; border-top: 1px solid #ddd; }
            .back { transform: rotateX(180deg); border-right: none; border-bottom: 1px solid #ccc; }
            .flipped { transform: rotateX(180deg); }

            h1 { font-size: 28px; }
            p.caption { font-size: 16px; margin-top: 15px; }
            .letter-content h2 { font-size: 20px; margin-bottom: 10px; }
            .letter-content p { font-size: 13px; line-height: 1.4; }
            .photo-frame { width: 75%; padding: 10px 10px 25px 10px; box-shadow: 2px 2px 15px rgba(0,0,0,0.15); }
            .tape { height: 25px; top: -12px; }
            .page-num { font-size: 12px; bottom: 10px; right: 10px; }
            .paper-ball { transform: scale(0.6); }
        }
    </style>
</head>
<body>

    <img src="images/ball.png" class="paper-ball" style="bottom: -5vh; left: -5vw; width: 25vw; transform: rotate(20deg);">
    <img src="images/ball.png" class="paper-ball" style="top: -10vh; right: -2vw; width: 18vw; transform: rotate(-45deg) scaleX(-1);">
    <img src="images/ball.png" class="paper-ball" style="bottom: 10vh; right: -8vw; width: 12vw; transform: rotate(90deg);">

    <div class="scene">
        <div class="book" id="bookContainer">
            <div class="book-base left"></div>
            <div class="book-base right"></div>
        </div>
    </div>

    <script>
        // ==========================================
        // CONTENT
        // ==========================================
        const memories = [
            { type: 'cover', title: 'Happy 31st!', text: 'To our best friend in the world.' , img: 'images/profile.jpg' },
            
            { type: 'photo', img: 'images/photo1.jpg', text: 'We didn’t know this child would grow up to be our best friend!' },
            { type: 'photo', img: 'images/photo2.jpg', text: 'Especially as he grew up, and started doing cool things (Needed some help with spelling though)' },
            { type: 'photo', img: 'images/photo3.jpg', text: 'We were finally lucky enough meet each other, and “The Tripod” was formed. 100% a Canon Event!' },
            { type: 'photo', img: 'images/photo4.jpg', text: 'We started to build cool shit together (even if it meant lugging around buckets and pipes)... ' },
            { type: 'photo', img: 'images/photo5.jpg', text: 'We built LonePack together - a journey where YOU kept us together and on track.' },
            { type: 'photo', img: 'images/photo6.jpg', text: 'You still continued crushing life in other arenas too! - from building ZohoSign to killing it at IIMB)' },
            { type: 'photo', img: 'images/photo7.jpg', text: 'We watched as you started to travel and branch out and try new experiences (So proud of you for it!) ' },
            { type: 'photo', img: 'images/photo8.jpg', text: 'Through this all you’ve continued being there for everyone who needs you and matters to you the most, such as your family…' },
            { type: 'photo', img: 'images/photo9.jpg', text: '..and especially us. We love you Naveen! #Tripod4Eva <3' },
            

            { type: 'letter', title: 'From Samiya', text: 'Dear Naveen, \nWhen we first met each other 14 (!!)  years ago, who’d have thought we’d become such good friends?! Over these years, I’ve watched you continue to grow, and explore new things - concerts, camping, travelling and of course, the iconic Thailand trip! I’ve learnt so much about you but if I had to pick one word to describe you, I’d say “constant”. You have been my constant all these years, through my highest highs and lowest lows, and all the chaos in between. You may be on the quieter side, but you hide a steely determination - once you make up your mind about something, you just work at it - no matter how long it takes, or hard it is. I really admire that. I have so much to learn from you, but thankfully I have the rest of our lives to keep working at it. Thank you for being YOU, Naveen. I love you and appreciate you!\nLove,\nSamiya' },
            { type: 'letter', title: 'From Siddhaarth', text: 'Dear Sensei!\nWhen I sat next to you on the first day of college on that eventful August morning that seems like a lifetime ago, little did I realize that I would be the start of something special. People can go their entire lives without finding a friend so loyal, a mentor so wise and kind, and a human being who leads with patience and empathy. How blessed must I be to have found all that in one soul! Thank you once again for everything you are, and everything you do!  ^_^\n\nLove, \nSid' },
            { type: 'letter', title: 'From Mom', text: 'Dear Raja\nOn your birthday, Wishing you a wonderful birthday and the year ahead filled with love, happiness, success, and everything your heart aspires for. You are one of the greatest blessings of my life.\nNo matter how tall you grow or how far you go, you will always be my child and my greatest joy. You are my pillar of support and I am proud of you, and I will always be here cheering for you.\n\nWith all my love,\nAmma' },
            { type: 'letter', title: 'From Dad', text: 'Our life revolves around your well being and  happiness. You take responsibilities without being told. Very balanced, kind and is close to our heart. Wishing you an excellent and wonderful birthday and year ahead.\n\n Appa' },
            { type: 'letter', title: 'From Grandparents', text: 'Happy birthday to Raja Kuttan \n\nFrom Thatha and Amma' },

            { type: 'cover', title: 'To infinity and beyond!', img: 'images/photo10.jpg' , text: 'Let us build core memories together!',wide: true }
        ];

        // ==========================================
        // BOOK BUILDER
        // ==========================================
        const bookContainer = document.getElementById('bookContainer');
        const totalPages = memories.length; 

        memories.forEach((memory, index) => {
            const pageNum = index + 1;
            const pageDiv = document.createElement('div');
            pageDiv.classList.add('page');
            pageDiv.id = `p${pageNum}`;
            pageDiv.onclick = () => flipPage(pageNum);

            let contentHTML = '';
            
            if (memory.type === 'cover') {
                
                // Logic: Is it a Wide Landscape photo? OR a Passport photo? OR No photo?
                let imgHTML = '';
                if (memory.img) {
                    if (memory.wide) {
                        // Landscape Style (Starry Night)
                        imgHTML = `<img src="${memory.img}" style="width: 90%; height: auto; display: block; margin: 20px auto; border: 4px solid #fff; box-shadow: 0 4px 8px rgba(0,0,0,0.2);">`;
                    } else {
                        // Passport Style (Front Cover)
                        imgHTML = `<img src="${memory.img}" style="width: 100px; height: 120px; object-fit: cover; border: 5px solid #fff; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin: 15px auto; transform: rotate(-3deg);">`;
                    }
                }

                contentHTML = `
                    <div class="face front">
                        <h1>${memory.title}</h1>
                        
                        ${imgHTML}

                        <p class="caption">${memory.text}</p>
                        ${pageNum === 1 ? '<p style="font-size: 12px; margin-top: 30px; opacity: 0.7;">(Tap right side)</p>' : ''}
                        <div class="page-num">${pageNum}</div>
                    </div>
                    <div class="face back"></div>
                `;
            } else if (memory.type === 'letter') {
                contentHTML = `
                    <div class="face front">
                        <div class="letter-content">
                            <h2>${memory.title}</h2>
                            <p>${memory.text}</p>
                        </div>
                        <div class="page-num">${pageNum}</div>
                    </div>
                    <div class="face back"></div>
                `;
            } else {
                const rotate = Math.floor(Math.random() * 6) - 3; 
                contentHTML = `
                    <div class="face front">
                        <div class="photo-frame" style="transform: rotate(${rotate}deg);">
                            <div class="tape"></div>
                            <img src="${memory.img}" alt="Memory" onerror="this.src='https://picsum.photos/400/300?random=${pageNum}'">
                        </div>
                        <p class="caption">${memory.text}</p>
                        <div class="page-num">${pageNum}</div>
                    </div>
                    <div class="face back"></div>
                `;
            }

            pageDiv.innerHTML = contentHTML;
            // CRITICAL FIX: Insert pages BEFORE the back cover base divs
            bookContainer.insertBefore(pageDiv, bookContainer.children[bookContainer.children.length - 2]);
        });

        // ==========================================
        // FLIP LOGIC
        // ==========================================
        function flipPage(pageNum) {
            const page = document.getElementById(`p${pageNum}`);
            const isFlipped = page.classList.contains('flipped');

            if (!isFlipped) {
                page.classList.add('flipped');
                setTimeout(() => {
                    page.style.zIndex = pageNum; 
                }, 600); 
            } else {
                page.style.zIndex = totalPages - pageNum + 1;
                page.classList.remove('flipped');
            }
        }

        for(let i=1; i<=totalPages; i++) {
            const page = document.getElementById(`p${i}`);
            page.style.zIndex = totalPages - i + 1;
        }

        // ==========================================
        // SMART STICKER ENGINE (Mobile Zones)
        // ==========================================
        const stickerTypes = ['images/sticker1.png', 'images/sticker2.png', 'images/sticker3.png', 'images/sticker4.png'];
        const maxRepetition = 4;
        let stickerDeck = [];
        stickerTypes.forEach(src => { for(let i=0; i<maxRepetition; i++) stickerDeck.push(src); });
        stickerDeck.sort(() => Math.random() - 0.5);

        let placedRects = []; 
        function initObstacles() {
            // 1. Balls
            const balls = document.querySelectorAll('.paper-ball');
            balls.forEach(ball => {
                const rect = ball.getBoundingClientRect();
                placedRects.push({ top: rect.top, left: rect.left, right: rect.right, bottom: rect.bottom });
            });

            // 2. Book Protection (Mobile & Desktop)
            const book = document.querySelector('.book');
            const bookRect = book.getBoundingClientRect();
            if(window.innerWidth < 768) {
                // Manually protect the bottom half of the screen
                const vh = window.innerHeight;
                placedRects.push({ top: vh * 0.4, left: 0, right: window.innerWidth, bottom: vh });
            } else {
                placedRects.push({ top: bookRect.top, left: bookRect.left, right: bookRect.right, bottom: bookRect.bottom });
            }
        }

        function spawnStickers() {
            initObstacles(); 
            const body = document.querySelector('body');
            const vw = window.innerWidth;
            const vh = window.innerHeight;
            const isMobile = vw < 768;

            stickerDeck.forEach(imgSrc => {
                let attempts = 0;
                let placed = false;
                while (!placed && attempts < 50) {
                    let topPct, leftPct;

                    if (isMobile) {
                        // --- MOBILE PLACEMENT: Top 30% or Bottom 10% Only ---
                        const zone = Math.random() > 0.7 ? 1 : 0; 
                        if (zone === 0) { 
                            topPct = Math.random() * 30; 
                            leftPct = Math.random() * 80 + 10; 
                        } else {
                            topPct = 90 + Math.random() * 5; 
                            leftPct = Math.random() * 80 + 10;
                        }
                    } else {
                        // --- DESKTOP PLACEMENT: Edges ---
                        const zone = Math.floor(Math.random() * 4);
                        if (zone === 0) { topPct = Math.random() * 15; leftPct = Math.random() * 90; } 
                        else if (zone === 1) { topPct = 80 + Math.random() * 15; leftPct = Math.random() * 90; } 
                        else if (zone === 2) { topPct = Math.random() * 90; leftPct = Math.random() * 15; } 
                        else { topPct = Math.random() * 90; leftPct = 80 + Math.random() * 15; } 
                    }

                    const sizeVw = (Math.random() * 6) + 7;
                    const sizePx = (sizeVw / 100) * vw;
                    const topPx = (topPct / 100) * vh;
                    const leftPx = (leftPct / 100) * vw;

                    const newRect = { top: topPx, left: leftPx, right: leftPx + sizePx, bottom: topPx + sizePx };
                    
                    let collision = false;
                    for (let rect of placedRects) {
                        const buffer = 10; 
                        if (newRect.left < rect.right + buffer && newRect.right > rect.left - buffer && newRect.top < rect.bottom + buffer && newRect.bottom > rect.top - buffer) {
                            collision = true; break;
                        }
                    }

                    if (!collision) {
                        const img = document.createElement('img');
                        img.src = imgSrc;
                        img.classList.add('sticker');
                        img.style.top = topPct + 'vh';
                        img.style.left = leftPct + 'vw';
                        img.style.width = sizeVw + 'vw';
                        img.style.transform = `rotate(${(Math.random() * 90) - 45}deg)`;
                        body.appendChild(img);
                        placedRects.push(newRect);
                        placed = true;
                    }
                    attempts++;
                }
            });
        }

        // ==========================================
        // INITIALIZATION
        // ==========================================
        window.onload = () => {
            setTimeout(spawnStickers, 100);

            // Quick Confetti
            setTimeout(() => {
                var count = 200;
                var defaults = { origin: { y: 0.7 }, ticks: 100, gravity: 1.2, decay: 0.94, startVelocity: 30 };
                function fire(particleRatio, opts) {
                    confetti(Object.assign({}, defaults, opts, { particleCount: Math.floor(count * particleRatio) }));
                }
                fire(0.25, { spread: 26, startVelocity: 55 });
                fire(0.2, { spread: 60 });
                fire(0.35, { spread: 100, decay: 0.91, scalar: 0.8 });
                fire(0.1, { spread: 120, startVelocity: 25, decay: 0.92, scalar: 1.2 });
                fire(0.1, { spread: 120, startVelocity: 45 });
            }, 500); 
        };
    </script>
</body>
</html>
